<div class="app-container" [attr.dir]="textDirection">
  <div class="app-header">
    <div class="header-top">
      <h1>{{ 'app.title' | translate }}</h1>
      <div class="language-selector">
        <label for="language-select">Language:</label>
        <select id="language-select" [(ngModel)]="currentLanguage" (change)="changeLanguage(currentLanguage)">
          <option value="en">English</option>
          <option value="ar">العربية</option>
        </select>
      </div>
    </div>
    <div class="app-controls">
      <div class="time-range-selector">
        <label for="fromTime">{{ 'app.labels.from' | translate }}</label>
        <input id="fromTime" type="datetime-local" [value]="selectedFromTime | date:'yyyy-MM-ddTHH:mm'" (change)="onFromTimeChange($event.target?.value)">

        <label for="toTime">{{ 'app.labels.to' | translate }}</label>
        <input id="toTime" type="datetime-local" [value]="selectedToTime | date:'yyyy-MM-ddTHH:mm'" (change)="onToTimeChange($event.target?.value)">
      </div>

      <div class="action-buttons">
        <button class="btn-action" (click)="addItem()">{{ 'app.buttons.addEvent' | translate }}</button>
        <button class="btn-action" (click)="addSection()">{{ 'app.buttons.addAttendee' | translate }}</button>
      </div>
    </div>
  </div>

  <div class="scheduler-container">
    <ngx-ts
       [items]="items"
       [periods]="periods"
       [sections]="sections"
       [events]="events"
       [showBusinessDayOnly]="false"
       [showHeaderTitle]="false"
       [showActionButtons]="false"
       [start]="startScheduler"
       [allowDragging]="false"
       [text]="txt"
       [selectedFromTime]="selectedFromTimeMoment"
       [selectedToTime]="selectedToTimeMoment"
       [attendeeGroupConfigs]="attendeeGroupConfigs"
       [availableAttendees]="availableAttendees"
       [initialAttendeeGroups]="initialAttendeeGroups"
       [language]="currentLanguage"
       (attendeeSelected)="onAttendeeSelected($event)"
    ></ngx-ts>
  </div>

  <div class="app-footer">
    <div class="legend">
      <div class="legend-item">
        <div class="legend-color status-busy"></div>
        <span>{{ 'app.legend.busy' | translate }}</span>
      </div>
      <div class="legend-item">
        <div class="legend-color status-free"></div>
        <span>{{ 'app.legend.free' | translate }}</span>
      </div>
      <div class="legend-item">
        <div class="legend-color status-tentative"></div>
        <span>{{ 'app.legend.tentative' | translate }}</span>
      </div>
      <div class="legend-item">
        <div class="legend-color status-out-of-office"></div>
        <span>{{ 'app.legend.outOfOffice' | translate }}</span>
      </div>
    </div>
  </div>
</div>
